name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but never run two at
# once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Lets webpack reuse its module cache across runs instead of rebuilding
      # from scratch every deploy.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # devDependencies are required: next.config.js requires
      # @next/bundle-analyzer unconditionally, and the prebuild step (create:sets) uses sharp.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Failing either check stops the deploy.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `prebuild` regenerates set data, `postbuild` runs `next export` into out/
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /rush-hub
          NEXT_PUBLIC_ENVIRONMENT: production
          NEXT_TELEMETRY_DISABLED: '1'

      # Stops GitHub Pages from stripping the _next/ directory.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
