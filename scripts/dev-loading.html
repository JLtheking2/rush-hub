<!doctype html>
<!--
  Opened by start-dev.vbs straight from disk, before the dev server is up.
  `next dev` compiles each page on its first request, so until then
  localhost:3000 just hangs. This page waits for the server, requests the main
  routes once so they're compiled, then redirects. Dev only - never deployed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting rush-hub…</title>
    <link rel="icon" href="../public/favicon/favicon-32x32.png" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --primary: #d35337;
        --track: rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f2f2f2;
          --muted: #a0a0a0;
          --track: rgba(255, 255, 255, 0.15);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 340px;
        text-align: center;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        border: 4px solid var(--track);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .done .spinner,
      .stuck .spinner {
        animation-play-state: paused;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        margin: 0 0 4px;
        font-size: 17px;
      }
      #elapsed {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        display: inline-block;
        text-align: left;
        font-size: 15px;
      }
      li {
        padding: 2px 0;
        color: var(--muted);
      }
      li::before {
        content: '○';
        display: inline-block;
        width: 1.5em;
      }
      li.ok {
        color: var(--fg);
      }
      li.ok::before {
        content: '✓';
        color: var(--primary);
      }
      #help {
        display: none;
        margin-top: 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .stuck #help {
        display: block;
      }
      a {
        color: var(--primary);
      }
      code {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>rush-hub</h1>
      <div class="spinner"></div>
      <p id="status">Starting dev server…</p>
      <p id="elapsed">0s</p>
      <ul id="routes"></ul>
      <p id="help">
        Still waiting. Check <code>dev-server.log</code> in the repo for
        errors, or <a href="http://localhost:3000/">open the site anyway</a>.
      </p>
    </main>
    <script>
      const ORIGIN = 'http://localhost:3000';
      // A public/ file needs no page compile, so it answers as soon as the
      // server has finished its initial build.
      const PROBE = '/favicon/favicon.ico';
      const ROUTES = [
        ['/', 'Home'],
        ['/creator', 'Creator'],
        ['/sets', 'Set Browser'],
      ];
      const STUCK_AFTER_MS = 90000;

      const started = Date.now();
      const statusEl = document.getElementById('status');
      const elapsedEl = document.getElementById('elapsed');
      const listEl = document.getElementById('routes');

      const ticker = setInterval(() => {
        const ms = Date.now() - started;
        elapsedEl.textContent = `${Math.floor(ms / 1000)}s`;
        if (ms > STUCK_AFTER_MS) document.body.classList.add('stuck');
      }, 250);

      // `no-cors` gives an opaque response, which is all we need: it resolves
      // once the server has answered at all, and rejects while nothing listens.
      const hit = path =>
        fetch(`${ORIGIN}${path}`, { mode: 'no-cors', cache: 'no-store' });

      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      const waitForServer = async () => {
        for (;;) {
          // A refused connection fails at once. A probe that hangs means the
          // server is listening but holding requests for its first compile.
          const hanging = setTimeout(() => {
            statusEl.textContent = 'Compiling…';
          }, 1000);
          try {
            await hit(`${PROBE}?${Date.now()}`);
            return;
          } catch {
            await wait(500);
          } finally {
            clearTimeout(hanging);
          }
        }
      };

      const items = ROUTES.map(([, label]) => {
        const item = document.createElement('li');
        item.textContent = label;
        listEl.appendChild(item);
        return item;
      });

      const warmRoute = async ([path], index) => {
        const item = items[index];
        // A route can fail while the server is still settling; retry.
        for (;;) {
          try {
            await hit(path);
            item.classList.add('ok');
            return;
          } catch {
            await wait(1000);
          }
        }
      };

      (async () => {
        await waitForServer();
        statusEl.textContent = 'Compiling pages…';
        await Promise.all(ROUTES.map(warmRoute));
        clearInterval(ticker);
        document.body.classList.add('done');
        statusEl.textContent = 'Ready';
        location.replace(`${ORIGIN}/`);
      })();
    </script>
  </body>
</html>
